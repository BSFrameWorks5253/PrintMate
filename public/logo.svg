<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pm-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Brand Cyan-to-Purple Gradient -->
    <linearGradient id="pm-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Laser Beam / Card Glow -->
    <linearGradient id="pm-laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Outer Rim Glow Filter -->
    <filter id="pm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00f2fe" flood-opacity="0.45" />
    </filter>

    <filter id="pm-laser-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pm-dark-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="url(#pm-brand-grad)" stroke-width="2" stroke-opacity="0.85" />

  <!-- 4 Corner Detection Target Brackets (Auto-Border/Deskew hallmark) -->
  <path d="M10 18 V12 A2 2 0 0 1 12 10 H18" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" />
  <path d="M46 10 H52 A2 2 0 0 1 54 12 V18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <path d="M54 46 V52 A2 2 0 0 1 52 54 H46" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" />
  <path d="M18 54 H12 A2 2 0 0 1 10 52 V46" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" />

  <!-- ID Card / Document (Entering Scanner/Printer Slot) -->
  <rect x="20" y="14" width="24" height="15" rx="3" fill="#ffffff" fill-opacity="0.95" />
  <!-- Card Photo Avatar Slot -->
  <rect x="22.5" y="16.5" width="6" height="7" rx="1.5" fill="#38bdf8" />
  <!-- Card Detail Text Lines -->
  <line x1="31" y1="18" x2="41" y2="18" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" />
  <line x1="31" y1="21" x2="38" y2="21" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" />

  <!-- Printer / Scanner Main Chassis (Curved High-Tech Body) -->
  <path d="M14 26 H50 A4 4 0 0 1 54 30 V39 A4 4 0 0 1 50 43 H14 A4 4 0 0 1 10 39 V30 A4 4 0 0 1 14 26 Z" fill="url(#pm-brand-grad)" filter="url(#pm-glow)" />

  <!-- Laser Scan Beam / Feed Slot -->
  <rect x="15" y="31.5" width="34" height="2" rx="1" fill="#030712" fill-opacity="0.6" />
  <line x1="16" y1="32.5" x2="48" y2="32.5" stroke="url(#pm-laser-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#pm-laser-glow)" />

  <!-- Status LED Lights (Power / Ready) -->
  <circle cx="16" cy="38" r="1.4" fill="#22c55e" />
  <circle cx="20" cy="38" r="1.4" fill="#38bdf8" />

  <!-- Print Sheet Output Tray / Ejected Document (Bottom) -->
  <path d="M19 41 H45 V46 A3 3 0 0 1 42 49 H22 A3 3 0 0 1 19 46 Z" fill="#ffffff" fill-opacity="0.9" />
  <line x1="24" y1="44" x2="40" y2="44" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="46.5" x2="35" y2="46.5" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" />
</svg>
